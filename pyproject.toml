[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "Autarkia-Cadence"
version = "0.1.0"
description = "Proactive message cadence governance: cooldowns, quiet hours, daily caps, adaptive intervals, backoff jitter, and sleep-window probes. Extracted from the Autarkia agent runtime."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Shihao Qi", email = "qishihao512@gmail.com" },
]
keywords = [
    "agent",
    "proactive",
    "notification",
    "rate-limit",
    "cooldown",
    "scheduling",
    "quiet-hours",
    "autarkia",
    "self-hosted",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://qishihao.icu/projects/autarkia"
Repository = "https://github.com/hakituo/Autarkia-Cadence"
Roadmap = "https://github.com/hakituo/Autarkia-tool/blob/main/ROADMAP.md"
"Autarkia Runtime" = "https://github.com/hakituo/Autarkia"
Author = "https://qishihao.icu"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/autarkia_cadence"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]
